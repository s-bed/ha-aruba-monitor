[project]
name = "aruba-monitor-integration-dev"
version = "0.2.2"
description = "Development tools for the Aruba Monitor Home Assistant integration"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]
